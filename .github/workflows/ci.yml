name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Mojo 0.25.6 can target CPU features masked by the runner's VM.
      # https://github.com/modular/modular/issues/6565
      # x86-64-v3 includes AVX2 and avoids AVX-512.
      STRUT_MOJO_ARCH: x86-64-v3
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Python format
        run: uv run ruff format --check .

      - name: Mojo format
        run: |
          uv run mojo format -q -l 100 src/mojo tests/mojo
          git diff --exit-code -- '*.mojo'

      - name: Cache Mojo build
        uses: actions/cache@v4
        with:
          path: |
            build/strut/strut
            build/strut/strut.src-sha256
          key: mojo-check-build-${{ runner.os }}-${{ env.STRUT_MOJO_ARCH }}-${{ hashFiles('uv.lock', 'scripts/build_mojo_solver.py', 'scripts/mojo_target.py', 'src/mojo/**/*.mojo') }}

      # Compiles the solver (type-checks Mojo) and fails on any compiler warning.
      - name: Build Mojo solver
        run: uv run python scripts/build_mojo_solver.py

      # Needs no downloaded fixtures: ground-motion tests write synthetic
      # records (scripts/synthetic_ground_motion.py), and tests that need the
      # pinned mega-tall model skip.
      - name: Unit tests
        run: uv run pytest -q -n auto tests/unit tests/validation/test_json_cases.py
