name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Python format
        run: uv run ruff format --check .

      - name: Mojo format
        run: |
          uv run mojo format -q -l 100 src/mojo tests/mojo
          git diff --exit-code -- '*.mojo'

      - name: Cache Mojo build
        uses: actions/cache@v4
        with:
          path: build/strut
          key: mojo-build-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ hashFiles('src/mojo/**/*.mojo') }}

      # Compiles the solver (type-checks Mojo) and fails on any compiler warning.
      - name: Build Mojo solver
        run: uv run python scripts/build_mojo_solver.py

      - name: Cache test fixtures
        uses: actions/cache@v4
        with:
          path: ~/.cache/strut/reference
          key: strut-fixtures-${{ hashFiles('tests/fixtures/opensees/reference-data.lock.json') }}

      - name: Install test fixtures
        run: uv run scripts/setup_reference_data.py install --fixtures-only

      - name: Unit tests
        run: uv run pytest -q -n auto tests/unit tests/validation/test_json_cases.py
